[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops_rca"
version = "0.1.0"
description = "Mikroservis ortamında kök neden analizi yöntemlerini aynı vakalarda ölçen altyapı"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
# Canlı demo web arayüzü (tools/live_demo.py serve; Eren onayı 2026-11-19): sürümler sabit, en az iki haftalık.
demo = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
