# Bizim Jaeger katmanımız (depolama kartı D2, DECISIONS 2026-10-25). compose.extras.yaml bunu upstream'in
# config.yml'ından sonra ikinci --config olarak yükler; eşlemeler birleşir (upstream'in memory_backend'i tanımlı
# kalır, kullanılmaz).
#
# İzler diske (badger), 7 gün saklama (ttl.spans). Boyut sınırı koşucunun korumasında (izleme volume'lerinin
# toplamı). Klasör /tmp: jaeger-data volume'ü oraya bağlı. İmaj Jaeger'i 10001 kullanıcısıyla çalıştırıyor ve
# imajda bu kullanıcının yazabildiği tek klasör /tmp (1777); Docker isimli volume'ü ilk açarken bu izni kopyalar.
# Yeni bir klasöre (ör. /badger) bağlansa volume root'un olur, Jaeger yazamaz (Eren onayı, 2026-10-25).

extensions:
  jaeger_storage:
    backends:
      badger_main:
        badger:
          directories:
            keys: /tmp/badger/keys
            values: /tmp/badger/values
          ephemeral: false
          ttl:
            spans: 168h
  jaeger_query:
    storage:
      traces: badger_main

exporters:
  jaeger_storage_exporter:
    trace_storage: badger_main
