# Süzülmemiş paralel çıkış (DECISIONS 2026-10-20): sadece `tools/otel_demo.sh up --raw` ile yüklenir,
# varsayılan kapalı. Yalnızca positive_control ve belirti korunması kontrolü için; cevabı içeren veri
# diske yazılır, iş bitince ~/cerebrum2/telemetry/raw/ silinir.
#
# Upstream'in processor'larından geçer, bizim süzme processor'larımızdan geçmez: süzülmüş dosyayla tek fark
# bizim süzmemiz olur. Alıcılar upstream'in birleşik listeleriyle aynı (3.1.0'da metrics'te prometheus/ad
# yok, kafkametrics var; upstream'in kendi davranışı). Span metrikleri ayrı bağlayıcıdan: süzülmüş
# span_metrics süzülmüş span'lerden üretilir.

connectors:
  span_metrics/raw:

exporters:
  file/raw_traces:
    path: /telemetry/raw/traces.jsonl
    format: json
    rotation:
      max_megabytes: 300
      max_backups: 2
  file/raw_metrics:
    path: /telemetry/raw/metrics.jsonl
    format: json
    rotation:
      max_megabytes: 300
      max_backups: 2
  file/raw_logs:
    path: /telemetry/raw/logs.jsonl
    format: json
    rotation:
      max_megabytes: 300
      max_backups: 2

service:
  pipelines:
    traces/raw:
      receivers: [otlp]
      processors: [resource_detection, memory_limiter, transform/sanitize_spans, gen_ai_normalizer, transform/redact_sensitive_data, redaction]
      exporters: [file/raw_traces, span_metrics/raw]
    metrics/raw:
      receivers: [docker_stats, http_check/frontend-proxy, host_metrics, nginx, otlp, redis, postgresql, span_metrics/raw, kafkametrics]
      processors: [resource_detection, memory_limiter]
      exporters: [file/raw_metrics]
    logs/raw:
      receivers: [otlp]
      processors: [resource_detection, memory_limiter, transform/sanitize_logs]
      exporters: [file/raw_logs]
