# Bizim compose katmanımız (DECISIONS 2026-10-18). tools/otel_demo.sh bunu demonun boş
# compose.extras.yaml'ının yerine, en son yükler. Upstream dosyalarına dokunulmaz.
#
# - Log: demonun değeri (json-file, 5 MB × 2); upstream'de sınırsız kalan iki servise.
# - Port: host'a sadece üç port, hepsi 127.0.0.1'de; diğerleri kapalı, servisler Docker ağı içinden konuşur.
#   Host portu sabit, konteyner portu demonun .env değişkeninden.
#   !override listeyi değiştirir; !reset listeyi boşaltır (ek dosyada ports normalde eklenir). Compose ≥ 2.24.4.
# - !reset yalnızca minimal modda (compose.yaml + compose.observability.yaml) tanımlı servislere yazılır;
#   başka servis yazılırsa Compose imajsız yarım servis yaratır. opamp-server port yayınlamıyor, burada yok.
# - Kalıcı izleme sistemi (depolama kartı, DECISIONS 2026-10-25): Prometheus, Jaeger ve OpenSearch isimli
#   volume'lerde; `down` volume silmez. Saklama 7 gün: Prometheus upstream'in retention.time'ı, Jaeger badger TTL
#   (jaeger-config-extras.yml), OpenSearch ISM kuralı (tools/otel_demo.sh up yükler). Boyut: Prometheus
#   retention.size 2GB; üçünün toplamı koşucunun korumasında (scenario_runner.py MAX_MONITORING_GB).

x-default-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  # Açık kalan üç port
  frontend-proxy:          # mağaza, /jaeger/ui, /grafana; Envoy admin 10000 kapalı
    logging: *logging
    ports: !override
      - "127.0.0.1:8080:${ENVOY_PORT}"
  # Komut upstream'in listesi + boyut sınırı (ek dosyada command listesi değiştirilir; upstream'deki sıra korunur,
  # demo güncellenince listeyi upstream'le karşılaştır). 2GB: ölçülen büyüme 0,004 GB/saat (depolama D2, Eren
  # onayı 2026-10-25); hangisi önce dolarsa (7 gün ya da 2GB) eski bloklar silinir.
  prometheus:
    command:
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=2GB"
      - "--config.file=/etc/prometheus/prometheus-config.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.route-prefix=/"
      - "--web.enable-otlp-receiver"
      - "--enable-feature=exemplar-storage"
    ports: !override
      - "127.0.0.1:9090:${PROMETHEUS_PORT}"
    volumes:
      - prometheus-data:/prometheus
  opensearch:
    ports: !override
      - "127.0.0.1:9200:${OPENSEARCH_PORT}"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  # Flag dosyası repo ve klon dışında (DECISIONS 2026-10-20): tools/otel_demo.sh up her seferinde
  # klondaki demo.flagd.json'u buraya kopyalar; flagd-ui yazınca klon kirlenmez.
  flagd-ui:
    logging: *logging
    ports: !reset []
    volumes: !override
      - ${HOME}/cerebrum2/runtime/flagd:/app/data

  # compose.yaml
  ad:
    ports: !reset []
  astronomy-db:
    ports: !reset []
  cart:
    ports: !reset []
  checkout:
    ports: !reset []
  currency:
    ports: !reset []
  email:
    ports: !reset []
  flagd:
    ports: !reset []
    volumes: !override
      - ${HOME}/cerebrum2/runtime/flagd:/etc/flagd
  frontend:
    ports: !reset []
  image-provider:
    ports: !reset []
  load-generator:
    ports: !reset []
  # Collector dosya çıkışı repo dışına (DECISIONS 2026-10-20). Kullanıcı upstream'de 0:0; burada eren +
  # docker grubu (OTEL_COLLECTOR_USER, tools/otel_demo.sh hesaplar): dosyalar eren'in olur, Docker soketi
  # docker grubuna açık. Ayar dosyası bizimki (OTEL_COLLECTOR_CONFIG_EXTRAS).
  otel-collector:
    ports: !reset []
    user: ${OTEL_COLLECTOR_USER}
    volumes:
      - ${HOME}/cerebrum2/telemetry:/telemetry
  payment:
    ports: !reset []
  product-catalog:
    ports: !reset []
  quote:
    ports: !reset []
  recommendation:
    ports: !reset []
  shipping:
    ports: !reset []
  telemetry-docs:
    ports: !reset []
  valkey-cart:
    ports: !reset []

  # compose.observability.yaml
  grafana:
    ports: !reset []
  # Komut upstream'inkine ikinci ayar dosyası eklenerek yeniden yazılır (ek dosyada command listesi değiştirilir).
  # Volume /tmp'de: gerekçe jaeger-config-extras.yml'da.
  # Bellek sınırı upstream'in 1200M'i yerine 2500M: badger'la Jaeger'in kendi belleği (anon) dakikalarca
  # 1064 MiB'e çıktı, 1200M'de tampon yalnız dosya önbelleğiydi (depolama D2, 2000M'e çıkarıldı); pilot gecede
  # 25 dk'lık vakalarda anon tepe 1.677–1.826 MiB, 2000M'in %84–91'i (DECISIONS 2026-10-26, 2500M).
  # V2a kuru denemesinden sonra: Jaeger'in Go yığını tepede ~3 GiB (2000M'de de 2500M'de de), RSS sınırda, taşan
  # kısım swap'ta; ihtiyaç sınırla değişmiyor. Geçme şartı OOM 0 ve yeniden başlama 0; anon, swap ve yığın tepesi
  # kayda (DECISIONS 2026-10-26 "Jaeger ölçütü düzeltmesi").
  jaeger:
    deploy:
      resources:
        limits:
          memory: 2500M
    ports: !reset []
    command:
      - "--config=file:/etc/jaeger/config.yml"
      - "--config=file:/etc/jaeger/config-extras.yml"
    volumes:
      - ${JAEGER_CONFIG_EXTRAS}:/etc/jaeger/config-extras.yml:ro
      - jaeger-data:/tmp

volumes:
  prometheus-data:
  jaeger-data:
  opensearch-data:
