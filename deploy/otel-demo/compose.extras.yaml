# Bizim compose katmanımız (DECISIONS 2026-10-18). tools/otel_demo.sh bunu demonun boş
# compose.extras.yaml'ının yerine, en son yükler. Upstream dosyalarına dokunulmaz.
#
# - Log: demonun değeri (json-file, 5 MB × 2); upstream'de sınırsız kalan iki servise.
# - Port: host'a sadece üç port, hepsi 127.0.0.1'de; diğerleri kapalı, servisler Docker ağı içinden konuşur.
#   Host portu sabit, konteyner portu demonun .env değişkeninden.
#   !override listeyi değiştirir; !reset listeyi boşaltır (ek dosyada ports normalde eklenir). Compose ≥ 2.24.4.
# - !reset yalnızca minimal modda (compose.yaml + compose.observability.yaml) tanımlı servislere yazılır;
#   başka servis yazılırsa Compose imajsız yarım servis yaratır. opamp-server port yayınlamıyor, burada yok.
# - Kalıcı izleme sistemi (depolama kartı, DECISIONS 2026-10-25): Prometheus, Jaeger ve OpenSearch isimli
#   volume'lerde; `down` volume silmez. Saklama 7 gün: Prometheus upstream'in retention.time'ı, Jaeger badger TTL
#   (jaeger-config-extras.yml), OpenSearch ISM kuralı (tools/otel_demo.sh up yükler). Boyut: Prometheus
#   retention.size 2GB; üçünün toplamı koşucunun korumasında (scenario_runner.py MAX_MONITORING_GB).

x-default-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  # Açık kalan üç port
  frontend-proxy:          # mağaza, /jaeger/ui, /grafana; Envoy admin 10000 kapalı
    logging: *logging
    ports: !override
      - "127.0.0.1:8080:${ENVOY_PORT}"
  # Komut upstream'in listesi + boyut sınırı (ek dosyada command listesi değiştirilir; upstream'deki sıra korunur,
  # demo güncellenince listeyi upstream'le karşılaştır). 2GB: ölçülen büyüme 0,004 GB/saat (depolama D2, Eren
  # onayı 2026-10-25); hangisi önce dolarsa (7 gün ya da 2GB) eski bloklar silinir.
  prometheus:
    command:
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=2GB"
      - "--config.file=/etc/prometheus/prometheus-config.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.route-prefix=/"
      - "--web.enable-otlp-receiver"
      - "--enable-feature=exemplar-storage"
    ports: !override
      - "127.0.0.1:9090:${PROMETHEUS_PORT}"
    volumes:
      - prometheus-data:/prometheus
  opensearch:
    ports: !override
      - "127.0.0.1:9200:${OPENSEARCH_PORT}"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  # Flag dosyası repo ve klon dışında (DECISIONS 2026-10-20): tools/otel_demo.sh up her seferinde
  # klondaki demo.flagd.json'u buraya kopyalar; flagd-ui yazınca klon kirlenmez.
  flagd-ui:
    logging: *logging
    ports: !reset []
    volumes: !override
      - ${HOME}/cerebrum2/runtime/flagd:/app/data

  # compose.yaml
  ad:
    ports: !reset []
  astronomy-db:
    ports: !reset []
  cart:
    ports: !reset []
  checkout:
    ports: !reset []
  currency:
    ports: !reset []
  email:
    ports: !reset []
  flagd:
    ports: !reset []
    volumes: !override
      - ${HOME}/cerebrum2/runtime/flagd:/etc/flagd
  frontend:
    ports: !reset []
  image-provider:
    ports: !reset []
  load-generator:
    ports: !reset []
  # Collector dosya çıkışı repo dışına (DECISIONS 2026-10-20). Kullanıcı upstream'de 0:0; burada eren +
  # docker grubu (OTEL_COLLECTOR_USER, tools/otel_demo.sh hesaplar): dosyalar eren'in olur, Docker soketi
  # docker grubuna açık. Ayar dosyası bizimki (OTEL_COLLECTOR_CONFIG_EXTRAS).
  otel-collector:
    ports: !reset []
    user: ${OTEL_COLLECTOR_USER}
    volumes:
      - ${HOME}/cerebrum2/telemetry:/telemetry
  payment:
    ports: !reset []
  product-catalog:
    ports: !reset []
  quote:
    ports: !reset []
  recommendation:
    ports: !reset []
  shipping:
    ports: !reset []
    # Kendi Python servisimiz araya girer: shipping → quote-gateway → quote (DECISIONS 2026-10-28 quote-gateway).
    environment:
      - QUOTE_ADDR=http://quote-gateway:${QUOTE_PORT}
    depends_on:
      quote-gateway:
        condition: service_started
  # Kendi Python servisimiz (services/quote-gateway/). İmaj CI'da derlenir, GHCR'da, digest'le sabit (DECISIONS
  # 2026-10-29 "İmajlar GHCR'da"; koşucudaki GATEWAY_IMAGE ile aynı). quote'un fiyat isteğini aynı arayüzle alır, quote'a iletir. OTel demodaki Python servisi
  # gibi otomatik; flag'ler flagd'den (deploy/otel-demo/flagd-extras.json). Bellek sınırı 128M: normal çalışmada
  # açılış tepesi 46,5 MiB, 20. dk'da 51,8 MiB (anon 40,4); ~2,4 kat pay. Sızıntı adayları buna göre (HANDOFF
  # 2026-10-28 quote-gateway c).
  # Swap kapalı (memswap_limit = bellek sınırı): Docker varsayılanı konteynere sınır kadar swap verir, sızıntı sınıra
  # varınca OOM yerine swap'a taşar (kalibrasyonda 1024 KB, 128 MiB'te OOM'suz). Sınıra varınca OOM ve yeniden
  # başlama olsun (DECISIONS 2026-10-28 "quote-gateway'in swap'ı kapalı").
  quote-gateway:
    image: ghcr.io/erenbezek/aiops-quote-gateway@sha256:333902cf518d8c059b2a880c753a0515f61350762e8859dbc5f65e9a7d83c9e9
    container_name: quote-gateway
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
    memswap_limit: 128M
    restart: unless-stopped
    environment:
      - QUOTE_ADDR
      - QUOTE_GATEWAY_PORT=${QUOTE_PORT}
      - FLAGD_HOST
      - FLAGD_PORT
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      - OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=high
      - OTEL_SERVICE_NAME=quote-gateway
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
      - OTEL_PYTHON_LOG_CORRELATION=true
    depends_on:
      otel-collector:
        condition: service_started
      flagd:
        condition: service_started
      quote:
        condition: service_started
  telemetry-docs:
    ports: !reset []
  valkey-cart:
    ports: !reset []

  # compose.observability.yaml
  grafana:
    ports: !reset []
  # Komut upstream'inkine ikinci ayar dosyası eklenerek yeniden yazılır (ek dosyada command listesi değiştirilir).
  # Volume /tmp'de: gerekçe jaeger-config-extras.yml'da.
  # Bellek sınırı upstream'in 1200M'i yerine 2500M: badger'la Jaeger'in kendi belleği (anon) dakikalarca
  # 1064 MiB'e çıktı, 1200M'de tampon yalnız dosya önbelleğiydi (depolama D2, 2000M'e çıkarıldı); pilot gecede
  # 25 dk'lık vakalarda anon tepe 1.677–1.826 MiB, 2000M'in %84–91'i (DECISIONS 2026-10-26, 2500M).
  # V2a kuru denemesinden sonra: Jaeger'in Go yığını tepede ~3 GiB (2000M'de de 2500M'de de), RSS sınırda, taşan
  # kısım swap'ta; ihtiyaç sınırla değişmiyor. Geçme şartı OOM 0 ve yeniden başlama 0; anon, swap ve yığın tepesi
  # kayda (DECISIONS 2026-10-26 "Jaeger ölçütü düzeltmesi").
  # GOMEMLIMIT=2000MiB (V2c denemesi, DECISIONS 2026-10-27): Go çalışma ortamı yığını bu sınıra yaklaşınca daha sık
  # temizler; 2500M (= 2.384 MiB) ile arasındaki pay yığın dışı bellek için. Geçme şartı her vakada Jaeger swap tepesi
  # < 500 MiB, OOM 0, yeniden başlama 0, gönderim hatası 0; geçmezse bu satır kaldırılır.
  jaeger:
    deploy:
      resources:
        limits:
          memory: 2500M
    environment:
      - GOMEMLIMIT=2000MiB
    ports: !reset []
    command:
      - "--config=file:/etc/jaeger/config.yml"
      - "--config=file:/etc/jaeger/config-extras.yml"
    volumes:
      - ${JAEGER_CONFIG_EXTRAS}:/etc/jaeger/config-extras.yml:ro
      - jaeger-data:/tmp

volumes:
  prometheus-data:
  jaeger-data:
  opensearch-data:
