<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canlı demo</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --line: #d9d9d4; --accent: #2f5d8a; --bad: #a33; --ok: #2d7a3e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1c1e; --fg: #e8e8e4; --muted: #9a9a94; --line: #34363a; --accent: #7fa7d1; --bad: #e07a7a; --ok: #7cc48a; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 16px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  select, button { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; }
  section { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 18px; }
  ol#steps { padding-left: 20px; margin: 6px 0; }
  ol#steps li.done { color: var(--ok); }
  #msg { color: var(--bad); min-height: 1.5em; }
  pre { white-space: pre-wrap; word-break: break-word; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 12px; font-size: 13px; overflow-x: auto; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Canlı demo</h1>
  <p class="sub">Hata enjekte edilir, ajan ana izleme yığınından araştırır, hata geri alınır. Ajan önerir, uygulamaz.</p>
  <div class="row">
    <label>Hata / senaryo <select id="fault"></select></label>
    <label>Model <select id="model"></select></label>
    <button class="primary" id="start">Başlat</button>
    <button id="stop" disabled>Durdur</button>
  </div>
  <div id="msg"></div>
  <section>
    <strong>İlerleme</strong> <span id="state"></span>
    <ol id="steps"></ol>
    <div id="grafana"></div>
  </section>
  <section>
    <strong>Rapor</strong>
    <pre id="report">Henüz rapor yok.</pre>
  </section>
</main>
<script>
const token = new URLSearchParams(location.search).get("t") || "";
const STEPS = [["alarm", "Hata enjekte edildi (alarm anı)"], ["agent_start", "Belirti süresi bitti, ajan başladı"],
               ["agent_end", "Ajan bitti"], ["reverted", "Hata geri alındı"]];
const $ = id => document.getElementById(id);
async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json", "X-Demo-Token": token},
                                        body: JSON.stringify(body)};
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error((await r.json()).detail || r.status);
  return r.json();
}
async function init() {
  const f = await api("/api/faults");
  for (const x of f.faults) $("fault").add(new Option(`${x.key} (${x.kind === "flag" ? "flag" : "altyapı"})`, x.key));
  for (const m of f.models) $("model").add(new Option(m, m, m === f.default_model, m === f.default_model));
  if (!token) $("msg").textContent = "Adreste belirteç yok: serve'ün bastığı adresi kullanın.";
  poll();
}
async function poll() {
  try {
    const s = await api("/api/status");
    $("start").disabled = s.running || !token;
    $("stop").disabled = !s.running || !token;
    $("state").textContent = s.key ? `${s.key}, ${s.model}: ${s.running ? "sürüyor" : (s.result || "bitti")}` : "";
    const t = s.times_utc || {};
    $("steps").innerHTML = STEPS.filter(([k]) => t[k]).map(([k, label]) => `<li class="done">${label}: ${t[k]}</li>`).join("");
    $("grafana").innerHTML = s.grafana ? `<a href="${s.grafana}" target="_blank" rel="noopener">Grafana panosu (pencere)</a>` : "";
    if (s.stopped) $("msg").textContent = `Durduruldu: ${s.stopped}`;
    if (s.report) { const r = await api("/api/report"); $("report").textContent = r.markdown; }
  } catch (e) { $("msg").textContent = String(e); }
  setTimeout(poll, 2000);
}
$("start").onclick = async () => {
  $("msg").textContent = ""; $("report").textContent = "Henüz rapor yok.";
  try { await api("/api/run", {key: $("fault").value, model: $("model").value}); } catch (e) { $("msg").textContent = String(e); }
};
$("stop").onclick = async () => { try { await api("/api/stop", {}); } catch (e) { $("msg").textContent = String(e); } };
init();
</script>
</body>
</html>
