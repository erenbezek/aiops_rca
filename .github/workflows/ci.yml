# CI: her PR'da ve main'e her push'ta testler temiz bir Linux makinesinde çalışır (DECISIONS 2026-10-16).
# Repo açık, günlükler herkese açık: gizli anahtar yok, ortam değişkeni ya da makine bilgisi yazdırılmaz.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash  # bash -eo pipefail: hata veren komut adımı kırmızı yapar

jobs:
  # Dal korumasında zorunlu kontrol bu job'un adıyla seçilir; ad değişirse kural da güncellenmeli.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Eklentiler commit SHA'sıyla sabit; SHA resmî sürüm etiketinden alındı, git ls-remote ile doğrulandı.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # erişim jetonu sonraki adımlar için klasörde bırakılmaz

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -k no_such_test  # KASITLI KIRMIZI (b): hiç test seçilmez, pytest çıkış kodu 5 beklenir

      # Çalışma zamanında sadece standart kütüphane kuralı: ekstrasız kurulum aiops_rca dışında hiçbir paket
      # eklememeli ya da değiştirmemeli. freeze --all: pip/setuptools/wheel da karşılaştırmaya girer.
      - name: Runtime install adds only aiops_rca
        run: |
          export LC_ALL=C
          venv="$RUNNER_TEMP/runtime-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip freeze --all | sort > "$RUNNER_TEMP/freeze-before.txt"
          "$venv/bin/python" -m pip install .
          "$venv/bin/python" -m pip freeze --all | sort > "$RUNNER_TEMP/freeze-after.txt"
          added="$(comm -13 "$RUNNER_TEMP/freeze-before.txt" "$RUNNER_TEMP/freeze-after.txt")"
          echo "New or changed packages:"
          echo "$added"
          count="$(printf '%s\n' "$added" | sed '/^$/d' | wc -l)"
          if [ "$count" -ne 1 ] || ! printf '%s\n' "$added" | grep -Eq '^aiops[-_]rca( @ |==)'; then
            echo "::error::runtime install must add only aiops_rca (found $count new or changed package lines)"
            exit 1
          fi

      # CLI geçici klasörün içinden çalışır: paket repodan değil kurulu kopyadan yüklenir.
      - name: Leakage CLI on clean fixture (installed copy)
        run: |
          mkdir -p "$RUNNER_TEMP/model_view"
          cp tests/fixtures/leakage/clean_symptoms.jsonl "$RUNNER_TEMP/model_view/data.jsonl"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/runtime-venv/bin/python" -m aiops_rca.leakage model_view
